<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>탐색 정보 공유 | Golden Step</title>
  <link rel="icon" type="image/png" href="./assets/icons/favicon.png">
  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/share-map.css">
</head>

<body>

  <header class="header">
    <div class="header-inner">

      <a class="header-logo" href="./index.html">
        <img src="./assets/images/golden-step-logo.png" alt="Golden Step">

        <span class="header-tagline">
          지금, 더 안전한 내일로
        </span>
      </a>

      <button class="emergency-button" type="button" aria-label="112 긴급 신고"></button>

    </div>
  </header>

  <main class="share-page">

    <section class="share-container">

      <div class="share-heading">

        <button class="share-back-button" id="share-back-button" type="button">
          <span aria-hidden="true">←</span>
          탐색결과로 돌아가기
        </button>

        <span class="share-label">
          SHARED SEARCH
        </span>

        <h1>
          공유된 탐색 정보
        </h1>

        <p>
          현재 탐색 상황과 우선 확인 지역을 확인할 수 있습니다.
        </p>

      </div>

      <section class="last-location-card" aria-labelledby="last-location-title">

        <div class="last-location-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 21S18.5 15 18.5 9.5A6.5 6.5 0 1 0 5.5 9.5C5.5 15 12 21 12 21Z"></path>
            <circle cx="12" cy="9.5" r="2.2"></circle>
          </svg>
        </div>

        <div class="last-location-content">

          <span class="card-label">
            마지막 확인 장소
          </span>

          <strong id="share-location">
            위치 정보를 불러오는 중입니다.
          </strong>

          <span id="share-last-seen-time">
            마지막 확인 시각을 불러오는 중입니다.
          </span>

        </div>

      </section>

      <section class="share-additional-info" id="share-additional-info" hidden>

        <div class="share-section-heading">

          <div>
            <span class="section-label">
              ADDITIONAL INFO
            </span>

            <h2>
              추가 정보
            </h2>
          </div>

        </div>

        <div class="share-additional-info-card">

          <p id="share-additional-info-text"></p>

        </div>

      </section>

      <section class="share-map-section">

        <div class="share-section-heading">

          <div>
            <span class="section-label">
              PRIORITY MAP
            </span>

            <h2>
              탐색 우선 지역
            </h2>
          </div>

          <div class="share-legend">

            <span>
              <i class="legend-color legend-high"></i>
              높음
            </span>

            <span>
              <i class="legend-color legend-medium"></i>
              중간
            </span>

            <span>
              <i class="legend-color legend-low"></i>
              낮음
            </span>

          </div>

        </div>

        <div class="share-map-wrapper">

          <div id="share-map" class="share-map" aria-label="공유된 탐색 지도"></div>

        </div>

      </section>

      <section class="share-priority-section">

        <div class="share-section-heading">

          <div>
            <span class="section-label">
              PRIORITY LOCATIONS
            </span>

            <h2>
              우선 확인 지역
            </h2>
          </div>

        </div>

        <div class="share-priority-list" id="share-priority-list">

          <div class="share-empty-state">
            분석 결과를 불러오는 중입니다.
          </div>

        </div>

      </section>

      <section class="share-actions">

        <button class="share-button" id="share-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <path d="M8.6 10.5L15.4 6.5"></path>
            <path d="M8.6 13.5L15.4 17.5"></path>
          </svg>

          <span>
            공유하기
          </span>
        </button>

        <p class="share-expiration">
          공유된 탐색 정보는 생성 후 12시간 동안 확인할 수 있습니다.
        </p>

      </section>

    </section>

  </main>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=d5iarqjubi"></script>
  <script src="./js/common.js"></script>
  <script src="./js/share-map.js"></script>

</body>

</html>
