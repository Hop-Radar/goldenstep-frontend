<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>탐색정보 입력 | Golden Step</title>

  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/search-form.css">
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <a class="header-logo" href="./index.html">
        <img src="./assets/images/golden-step-logo.png" alt="Golden Step">
      </a>

      <button class="emergency-button" type="button" aria-label="112 긴급 신고"></button>
    </div>
  </header>

  <main class="search-page">
    <div class="search-panel">
      <div class="search-heading">
        <h1>탐색정보 <strong>입력</strong></h1>
        <p>탐색 조건을 설정하고 안전한 경로와 정보를 확인해보세요.</p>
      </div>

      <form class="search-form" id="search-form">
        <div class="form-item">
          <div class="form-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
          </div>

          <div class="form-content">
            <label for="last-location">
              마지막 확인 위치
              <span class="required">*</span>
            </label>

            <div class="input-wrapper">
              <input id="last-location" name="lastLocation" type="text" placeholder="장소, 주소 또는 지역을 입력하세요." required>

              <button class="location-search-button" id="location-search-button" type="button"
                aria-label="마지막 확인 위치 검색">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="6"></circle>
                  <path d="m16 16 4 4"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="form-item">
          <div class="form-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M16 3v4M8 3v4M3 10h18"></path>
              <path d="M8 14h2M14 14h2M8 17h2M14 17h2"></path>
            </svg>
          </div>

          <div class="form-content">
            <label for="last-seen-date">
              마지막 확인 시각
              <span class="required">*</span>
            </label>

            <div class="date-time-fields">
              <input id="last-seen-date" class="date-input" name="lastSeenDate" type="date" aria-label="마지막 확인 날짜"
                required>

              <div class="time-select-group">
                <select id="last-seen-hour" name="lastSeenHour" aria-label="마지막 확인 시간" required>
                  <option value="" selected disabled>시간 선택</option>
                </select>

                <select id="last-seen-minute" name="lastSeenMinute" aria-label="마지막 확인 분" required>
                  <option value="" selected disabled>분 선택</option>
                </select>
              </div>
            </div>

            <input id="last-seen-time" name="lastSeenTime" type="hidden">
          </div>
        </div>

        <section class="person-card">
          <button class="person-toggle" id="person-toggle" type="button" aria-expanded="false"
            aria-controls="person-details">
            <span class="person-toggle-left">
              <span class="form-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path>
                </svg>
              </span>

              <span class="person-toggle-text">
                <span class="person-toggle-title">
                  대상자 정보
                  <span class="required">*</span>
                </span>

                <span class="person-summary" id="person-summary">
                  대상자의 특성을 입력해주세요.
                </span>
              </span>
            </span>

            <svg class="toggle-arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>

          <div class="person-details" id="person-details" hidden>
            <fieldset class="person-fieldset">
              <legend>
                대상자 분류
                <span class="required">*</span>
              </legend>

              <div class="choice-grid person-type-grid">
                <label class="choice-button">
                  <input type="radio" name="personType" value="child" required>
                  <span>어린아이</span>
                </label>

                <label class="choice-button">
                  <input type="radio" name="personType" value="teenager">
                  <span>청소년</span>
                </label>

                <label class="choice-button">
                  <input type="radio" name="personType" value="adult-female">
                  <span>성인 여성</span>
                </label>

                <label class="choice-button">
                  <input type="radio" name="personType" value="adult-male">
                  <span>성인 남성</span>
                </label>

                <label class="choice-button">
                  <input type="radio" name="personType" value="senior-female">
                  <span>노약자(여성)</span>
                </label>

                <label class="choice-button">
                  <input type="radio" name="personType" value="senior-male">
                  <span>노약자(남성)</span>
                </label>
              </div>
            </fieldset>

            <div class="person-row">
              <div class="person-field">
                <label for="person-age">
                  나이
                  <span class="optional">(선택)</span>
                </label>

                <select id="person-age" name="personAge">
                  <option value="" selected>나이를 선택하세요</option>
                </select>
              </div>
            </div>

            <div class="person-status-grid">
              <fieldset class="person-fieldset">
                <legend>
                  장애 여부
                  <span class="required">*</span>
                </legend>

                <div class="choice-grid status-choice-grid">
                  <label class="choice-button">
                    <input type="radio" name="disabilityStatus" value="none" required>
                    <span>없음</span>
                  </label>

                  <label class="choice-button">
                    <input type="radio" name="disabilityStatus" value="yes">
                    <span>있음</span>
                  </label>

                  <label class="choice-button">
                    <input type="radio" name="disabilityStatus" value="unknown">
                    <span>알 수 없음</span>
                  </label>
                </div>
              </fieldset>

              <fieldset class="person-fieldset">
                <legend>
                  질환 여부
                  <span class="required">*</span>
                </legend>

                <div class="choice-grid status-choice-grid">
                  <label class="choice-button">
                    <input type="radio" name="diseaseStatus" value="none" required>
                    <span>없음</span>
                  </label>

                  <label class="choice-button">
                    <input type="radio" name="diseaseStatus" value="yes">
                    <span>있음</span>
                  </label>

                  <label class="choice-button">
                    <input type="radio" name="diseaseStatus" value="unknown">
                    <span>알 수 없음</span>
                  </label>
                </div>
              </fieldset>
            </div>

            <div class="person-field additional-info-field">
              <label for="additional-info">
                추가 정보
                <span class="optional">(선택)</span>
              </label>

              <textarea id="additional-info" name="additionalInfo" rows="3"
                placeholder="인상착의, 신체적 특징 등 탐색에 도움이 되는 정보를 입력하세요."></textarea>
            </div>

            <button class="person-complete-button" id="person-complete-button" type="button">
              입력 완료
            </button>
          </div>
        </section>

        <div class="form-item map-item">
          <div class="map-heading">
            <div class="form-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path>
                <path d="M9 3v15M15 6v15"></path>
              </svg>
            </div>

            <div class="form-content">
              <p class="map-title">
                지도 선택
                <span class="required">*</span>
              </p>

              <p class="map-description">
                지도를 클릭하여 마지막 확인 위치를 선택하세요.
              </p>
            </div>
          </div>

          <div id="search-map" class="search-map" role="application" aria-label="마지막 확인 위치 선택 지도">
            <div class="map-placeholder">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                <circle cx="12" cy="10" r="2.5"></circle>
              </svg>

              <span>지도 API 영역</span>
              <p>위치를 선택하면 이곳에 표시됩니다.</p>
            </div>
          </div>
        </div>

        <button class="search-submit-button" type="submit">
          <span>탐색 시작하기</span>
          <span class="submit-arrow" aria-hidden="true">→</span>
        </button>
      </form>
    </div>
  </main>

  <script src="./js/search-form.js"></script>
</body>

</html>
