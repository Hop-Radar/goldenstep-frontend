<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Golden Step</title>

  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <a class="header-logo" href="./index.html">
        <img src="./assets/images/golden-step-logo.png" alt="Golden Step">
      </a>

      <button class="emergency-button" type="button" aria-label="112 긴급 신고"></button>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <p class="hero-eyebrow">
          DATA-DRIVEN SEARCH SUPPORT
        </p>

        <h1 class="hero-title">
          데이터로 만드는<br>
          더 빠른 탐색의 시작,
          <strong>Golden Step</strong>
        </h1>

        <p class="hero-description">
          마지막 확인 위치와 경과 시간 등의 데이터를 분석하여<br>
          이동 가능 범위와 우선 확인 지역을 안내하는
          <strong>탐색 지원 서비스</strong>입니다.
        </p>

        <div class="hero-notice">
          <div class="notice-icon" aria-hidden="true">i</div>

          <div class="notice-content">
            <p class="notice-title">
              Golden Step은 실종된 사람을 직접 찾거나 구조하는 서비스가 아닙니다.
            </p>

            <p class="notice-description">
              데이터 분석을 통해 탐색 범위를 좁히고, 우선 확인 지역을 안내하는 서비스입니다.
            </p>
          </div>
        </div>

        <a class="hero-button" href="./search-form.html">
          <span>탐색 시작</span>
          <span class="hero-button-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

  <script src="./js/main.js"></script>
</body>

</html>
